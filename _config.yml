# サイト全体の設定（GitHub Pages / Jekyll）
# 変更したら git push するだけで反映される（反映まで1〜2分）

title: AI開発メモ
description: >-
  Claude Code などの AI ツールの使い方や、AI と一緒に進めるゲーム制作・画像生成の環境づくりを、初心者目線でまとめるブログです。
author: カステラ
lang: ja

# 独自ドメインを使うときはここに書く（例: https://example.com）。github.io のままなら空でよい
# url: ""

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 記事の URL は /posts/ファイル名/ （公開後に変えると URL が変わって検索順位がリセットされるので変えない）
permalink: /posts/:title/
timezone: Asia/Tokyo

# 上部メニューに出すページの順番
header_pages:
  - about.md
  - privacy.md

# Google Search Console の所有権確認（jekyll-seo-tag が meta タグを出す）
webmaster_verifications:
  google: x2Vdh-QP-uCHGe9ljmHHePg5wrgLHfpDNQFw9FzMi6U

# 広告コード（AdSense 合格後に ca-pub-XXXXXXXX を入れる。空なら何も出ない）
adsense_client: ""

exclude:
  - README.md
  - CLAUDE.md
  - PROGRESS.md
